<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handhold history</title>
<style>
  :root { --bg: #ffffff; --fg: #1f1f1f; --muted: #6b6b6b; --line: #e6e6e6; --accent: #2f6f4f; --chip: #eef5f0; }
  :root[data-theme="dark"] { --bg: #1e1e1e; --fg: #ececec; --muted: #a0a0a0; --line: #333333; --accent: #7cc49b; --chip: #24332b; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 16px; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; margin-bottom: 10px; }
  h1 { font-size: 15px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .filters { display: flex; gap: 6px; margin-left: auto; }
  button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--chip); border-color: var(--accent); color: var(--accent); }
  ol { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid var(--line); padding: 8px 0; }
  .when { color: var(--muted); font-size: 12px; }
  .prompt { margin: 2px 0; overflow-wrap: anywhere; }
  .habit { display: inline-block; font-size: 12px; background: var(--chip); color: var(--accent); border-radius: 4px; padding: 0 6px; }
  .status { font-size: 12px; color: var(--muted); }
  details { margin-top: 4px; font-size: 13px; }
  summary { cursor: pointer; color: var(--accent); }
  .empty { color: var(--muted); padding: 16px 0; }
</style>
</head>
<body>
<header>
  <h1>Handhold history</h1>
  <span class="meta" id="meta">Loading…</span>
  <div class="filters" role="group" aria-label="Show">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="coached" aria-pressed="false">Coached</button>
    <button data-f="unscored" aria-pressed="false">Unscored</button>
  </div>
</header>
<ol id="list"></ol>
<script type="module">
/*__APP_CLIENT__*/
const { App } = window.McpApps
let data = { scope: '', turns: [] }
let filter = 'all'
const list = document.getElementById('list')
const meta = document.getElementById('meta')
const fmt = ms => new Date(ms).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n }

function render() {
  const coached = data.turns.filter(t => t.status === 'coached').length
  const unscored = data.turns.filter(t => t.status === 'unscored').length
  meta.textContent = `${data.scope} · ${data.turns.length} turns · ${coached} coached · ${unscored} unscored`
  const rows = data.turns.filter(t => filter === 'all' || t.status === filter)
  list.replaceChildren()
  if (rows.length === 0) { list.append(el('li', 'empty', 'Nothing to show.')); return }
  for (const t of rows) {
    const li = el('li')
    li.append(el('div', 'when', `${fmt(t.startMs)} · ${t.tools} tool${t.tools === 1 ? '' : 's'} · ${t.tokens.toLocaleString()} tokens`))
    li.append(el('div', 'prompt', t.prompt))
    if (t.status === 'coached') {
      li.append(el('span', 'habit', `To work on: ${t.habit}`))
      if (t.rewrite) { const d = el('details'); d.append(el('summary', null, 'Try instead'), el('div', null, t.rewrite)); li.append(d) }
    } else {
      li.append(el('span', 'status', t.status === 'skipped' ? 'No coaching needed' : 'Not scored yet'))
    }
    list.append(li)
  }
}

for (const b of document.querySelectorAll('button[data-f]')) {
  b.addEventListener('click', () => {
    filter = b.dataset.f
    for (const o of document.querySelectorAll('button[data-f]')) o.setAttribute('aria-pressed', String(o === b))
    render()
  })
}

const theme = ctx => { if (ctx?.theme) document.documentElement.dataset.theme = ctx.theme }
const app = new App({ name: 'handhold-history', version: '0.0.1' })
app.ontoolresult = r => { if (r.structuredContent) { data = r.structuredContent; render() } }
app.onhostcontextchanged = theme
await app.connect()
theme(app.getHostContext?.())
</script>
</body>
</html>
